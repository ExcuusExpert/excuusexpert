<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ExcuusExpert - De Beste Schoolsmoesjes</title>

  <!-- Google SEO & Favicon -->
  <meta name="description" content="Vind direct de beste en meest geloofwaardige schoolsmoesjes voor te laat komen, vergeten huiswerk en meer met ExcuusExpert!">
  <link rel="icon" type="image/png" href="jouw-logo.png">
  <meta name="google-site-verification" content="6CH9S9xC1Fp_FROwEj38SJQM01kB6wiO9QQFOhzRPNw" />

  <!-- Modern Lettertype & FontAwesome Iconen -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- GoatCounter Statistieken -->
  <script data-goatcounter="https://excuusexpert.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>

  <style>
    /* ================================
       THEMA & STYLING
    ================================= */
    :root {
      --bg-color: #0b0d17;
      --card-bg: rgba(18, 20, 33, 0.85);
      --input-bg: #141727;
      --text-main: #ffffff;
      --text-muted: #94a3b8;
      --border-color: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(129, 140, 248, 0.4);
      --accent-color: #6366f1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 28px;
      padding: 36px 28px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5),
                  0 0 40px rgba(108, 99, 255, 0.15);
      backdrop-filter: blur(12px);
    }

    .logo {
      text-align: center;
      font-size: 38px;
      font-weight: 800;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #ffffff 40%, #818cf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -1px;
    }

    .description {
      text-align: center;
      color: var(--text-muted);
      font-size: 15px;
      margin-bottom: 24px;
    }

    /* PANIEKKNOP STYLING */
    .panic-container {
      width: 100%;
      margin: 0 auto 28px auto;
      text-align: center;
    }

    #panicBtn {
      width: 100%;
      padding: 14px 18px;
      background: linear-gradient(135deg, #b91c1c 0%, #7f1d1d 100%);
      color: #ffffff;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(127, 29, 29, 0.35);
      transition: all 0.2s ease;
      letter-spacing: 0.5px;
    }

    #panicBtn:hover {
      background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
      box-shadow: 0 6px 20px rgba(220, 38, 38, 0.4);
    }

    #panicBtn:active {
      transform: scale(0.98);
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 10px;
      color: #e2e8f0;
      letter-spacing: 0.2px;
    }

    .select-wrapper {
      position: relative;
      margin-bottom: 24px;
    }

    .select-wrapper::after {
      content: '\f107';
      font-family: 'Font Awesome 6 Free';
      font-weight: 900;
      position: absolute;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    select {
      width: 100%;
      padding: 16px 18px;
      background: var(--input-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      transition: all 0.25s ease;
    }

    select:hover, select:focus {
      border-color: var(--border-hover);
      box-shadow: 0 0 15px rgba(108, 99, 255, 0.15);
    }

    .slider-container {
      margin-bottom: 28px;
    }

    .slider {
      width: 100%;
      height: 8px;
      border-radius: 4px;
      background: #1e2238;
      outline: none;
      cursor: pointer;
      accent-color: var(--accent-color);
    }

    .strength-display {
      margin-top: 8px;
      font-size: 13px;
      color: var(--text-muted);
      text-align: right;
    }

    .strength-number {
      color: var(--accent-color);
      font-weight: 700;
    }

    .generate-button {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      color: #fff;
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(99, 102, 241, 0.4);
      transition: all 0.2s ease;
    }

    .generate-button:hover {
      opacity: 0.95;
      box-shadow: 0 6px 25px rgba(99, 102, 241, 0.6);
    }

    .result {
      display: none;
      margin-top: 28px;
      padding: 20px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      border-radius: 16px;
    }

    .result-title {
      font-size: 13px;
      font-weight: 700;
      color: var(--accent-color);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }

    .result-text {
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 16px;
      color: #f1f5f9;
    }

    .button-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .action-btn {
      padding: 10px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      color: #fff;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s ease;
    }

    .action-btn:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    /* MODAL POP-UP STYLING */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(4, 5, 8, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      padding: 20px;
      box-sizing: border-box;
    }

    .modal-card {
      background: rgba(18, 20, 33, 0.95);
      border: 1px solid rgba(239, 68, 68, 0.4);
      box-shadow: 0 0 40px rgba(239, 68, 68, 0.25);
      border-radius: 24px;
      padding: 24px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      margin: auto;
      box-sizing: border-box;
      animation: popUp 0.25s ease-out;
    }

    @keyframes popUp {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .modal-badge {
      background: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 20px;
    }

    .close-btn {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 24px;
      cursor: pointer;
    }

    .modal-text {
      font-size: 16px;
      color: #ffffff;
      line-height: 1.5;
      margin-bottom: 20px;
      font-weight: 600;
    }

    .copy-panic-btn {
      width: 100%;
      padding: 12px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    @media (max-width: 500px) {
      .container { padding: 28px 20px; }
      .logo { font-size: 32px; }
      .button-group { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>

  <!-- HOOFDCONTAINER -->
  <div class="container">

    <h1 class="logo">ExcuusExpert</h1>
    <p class="description">De slimste smoesgenerator voor school.</p>

    <!-- INSTANT PANIEKKNOP -->
    <div class="panic-container">
      <button id="panicBtn" onclick="generatePanicExcuse()">
        <i class="fa-solid fa-triangle-exclamation"></i> INSTANT PANIEKKNOP
      </button>
    </div>

    <!-- INPUTFELDEN -->
    <label for="probleem">Wat is er gebeurd?</label>
    <div class="select-wrapper">
      <select id="probleem">
        <option value="Te laat">Te laat</option>
        <option value="Huiswerk vergeten">Huiswerk vergeten</option>
        <option value="Proefwerk niet geleerd">Proefwerk niet geleerd</option>
        <option value="Boek vergeten">Boek vergeten</option>
        <option value="Te weinig tijd gehad">Te weinig tijd gehad</option>
      </select>
    </div>

    <div class="slider-container">
      <label for="strengheid">Hoe streng is je docent?</label>
      <input
        class="slider"
        type="range"
        id="strengheid"
        min="1"
        max="10"
        value="5"
        step="1"
        oninput="document.getElementById('strengheidWaarde').textContent = this.value;"
      >
      <div class="strength-display">
        Strengheid: <span class="strength-number"><span id="strengheidWaarde">5</span>/10</span>
      </div>
    </div>

    <button class="generate-button" id="generateButton" type="button">
      ✨ Genereer mijn smoes
    </button>

    <!-- RESULTAAT BLOK -->
    <div class="result" id="result">
      <div class="result-title">
        <i class="fa-solid fa-lightbulb"></i> Jouw smoes
      </div>
      <div class="result-text" id="resultText"></div>

      <div class="button-group">
        <button id="copyBtn" class="action-btn">
          <i class="fa-regular fa-copy"></i> Kopieer
        </button>
        <button id="shareBtn" class="action-btn">
          <i class="fa-solid fa-share-nodes"></i> Deel dit!
        </button>
      </div>
    </div>

  </div>

  <!-- POP-UP MODAL (STAAT VOLLEDIG BUITEN DE CONTAINER VOOR GOEDE CENTRERING) -->
  <div id="panicModal" class="modal-overlay" onclick="closePanicModal(event)">
    <div class="modal-card">
      <div class="modal-header">
        <span class="modal-badge">🚨 SPOEDEXCUUS</span>
        <button class="close-btn" onclick="closePanicModalDirect()">&times;</button>
      </div>
      <p id="panicText" class="modal-text"></p>
      <button class="copy-panic-btn" onclick="copyPanicExcuse()">
        <i class="fa-regular fa-copy"></i> Kopieer Excuus
      </button>
    </div>
  </div>

  <!-- SCRIPT BINDING -->
  <script src="script.js"></script>

</body>
</html>
