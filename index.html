<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ExcuusExpert - De Beste Schoolsmoesjes</title>

  <!-- Plak de beschrijving voor Google hier neer -->
  <meta name="description" content="Vind direct de beste en meest geloofwaardige schoolsmoesjes voor te laat komen, vergeten huiswerk en meer met ExcuusExpert!">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="jouw-logo.png">

  <!-- Google Search Console Verificatie -->
  <meta name="google-site-verification" content="u2OvfDFo3hyKXinuu9j8TVCFQFK9cqHqi-0EDEAv54s" />

  <style>

    /* ================================
       BASIS
    ================================= */

    body {
      background: #0b0b12;
      color: white;
      font-family: Arial, sans-serif;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column; /* Zorgt dat de container en footer onder elkaar staan */
      justify-content: center;
      align-items: center;
      padding: 20px 0;
      box-sizing: border-box;
    }


    /* ================================
       CONTAINER
    ================================= */

    .container {
      width: 90%;
      max-width: 600px;
      background: #151521;
      padding: 30px;
      border-radius: 20px;
      box-sizing: border-box;
      border: 1px solid #29294a;
      box-shadow: 0 0 30px rgba(80, 60, 255, 0.15);
    }


    /* ================================
       LOGO
    ================================= */

    .logo {
      color: #6c63ff;
      text-align: center;
      font-size: 40px;
      margin-bottom: 10px;
      text-shadow: 0 0 15px rgba(108, 99, 255, 0.6);
    }


    /* ================================
       BESCHRIJVING
    ================================= */

    .description {
      text-align: center;
      color: #9a9aad;
      margin-bottom: 30px;
    }


    /* ================================
       LABELS
    ================================= */

    label {
      display: block;
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 8px;
      color: #dddded;
    }


    /* ================================
       SELECT
    ================================= */

    select {
      width: 100%;
      padding: 14px;
      background: #0f0f18;
      color: white;
      border: 1px solid #34345a;
      border-radius: 12px;
      font-size: 16px;
      outline: none;
      cursor: pointer;
      box-sizing: border-box;
      transition: 0.2s;
    }


    select:focus {
      border-color: #6c63ff;
      box-shadow: 0 0 10px rgba(108, 99, 255, 0.2);
    }


    /* ================================
       FOOTER TEKST
    ================================= */

    .footer-text {
      text-align: center;
      color: #9a9aad;
      font-size: 14px;
      margin-top: 25px;
    }
    }


    /* ================================
   SLIDER
================================= */

.slider-container {
  margin-top: 30px;
}

.slider {
  width: 100%;
  height: 8px;
  border-radius: 10px;
  /* Blauw naar rood verloopbalk */
  background: linear-gradient(to right, #3b82f6, #ef4444);
  outline: none;
  cursor: pointer;
  appearance: none;
  -webkit-appearance: none;
}

/* Chrome / Edge / Safari */
.slider::-webkit-slider-thumb {
  appearance: none;
  -webkit-appearance: none;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: #ffffff; /* Wit bolletje */
  border: 3px solid #ffffff; /* Paarse rand voor een mooi accent */
  box-shadow: 0 0 12px rgba(255, 255, 255, 0.6);
  cursor: pointer;
  margin-top: -7px;
}

/* Firefox */
.slider::-moz-range-thumb {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: #ffffff; /* Wit bolletje */
  border: 3px solid #ffffff; /* Paarse rand voor een mooi accent */
  box-shadow: 0 0 12px rgba(255, 255, 255, 0.6);
  cursor: pointer;

}
    /* ================================
       STRENGHEID TEKST
    ================================= */

    .strength-display {

      text-align: center;

      margin-top: 15px;

      color: #9a9aad;

    }


    .strength-number {

      color: #6c63ff;

      font-size: 22px;

      font-weight: bold;

    }


    /* ================================
       GENERATE KNOP
    ================================= */

    .generate-button {

      width: 100%;

      margin-top: 30px;

      padding: 16px;

      border: none;

      border-radius: 12px;

      background: #6c63ff;

      color: white;

      font-size: 17px;

      font-weight: bold;

      cursor: pointer;

      box-shadow:
        0 0 20px rgba(108, 99, 255, 0.35);

      transition: 0.2s;

    }


    .generate-button:hover {

      background: #7b73ff;

      transform: translateY(-1px);

      box-shadow:
        0 0 25px rgba(108, 99, 255, 0.5);

    }


    .generate-button:active {

      transform: translateY(1px);

    }


    /* ================================
       RESULTAAT
    ================================= */

    .result {

      display: none;

      margin-top: 25px;

      padding: 20px;

      background: #0f0f18;

      border: 1px solid #34345a;

      border-radius: 15px;

      animation: verschijnen 0.25s ease;

    }


    @keyframes verschijnen {

      from {

        opacity: 0;

        transform: translateY(8px);

      }

      to {

        opacity: 1;

        transform: translateY(0);

      }

    }


    /* ================================
       RESULTAAT TITEL
    ================================= */

    .result-title {

      color: #6c63ff;

      font-weight: bold;

      margin-bottom: 10px;

    }


    /* ================================
       RESULTAAT TEKST
    ================================= */

    .result-text {

      color: #dddded;

      line-height: 1.6;

      font-size: 16px;

    }


    /* ================================
       RESPONSIVE
    ================================= */

    @media (max-width: 600px) {

      .container {

        width: 94%;

        padding: 22px;

      }


      .logo {

        font-size: 32px;

      }

    }

  </style>

</head>


<body>


  <div class="container">


    <!-- ================================
         LOGO
    ================================= -->

    <h1 class="logo">
      ExcuusExpert
    </h1>


    <!-- ================================
         BESCHRIJVING
    ================================= -->

    <p class="description">
      De slimste smoesgenerator voor school.
    </p>


    <!-- ================================
         PROBLEEM KIEZEN
    ================================= -->

    <label for="probleem">
      Wat is er gebeurd?
    </label>


    <select id="probleem">

      <option value="Te laat">
        Te laat
      </option>

      <option value="Huiswerk vergeten">
        Huiswerk vergeten
      </option>

      <option value="Proefwerk niet geleerd">
        Proefwerk niet geleerd
      </option>

      <option value="Boek vergeten">
        Boek vergeten
      </option>

      <option value="Te weinig tijd gehad">
        Te weinig tijd gehad
      </option>

    </select>


    <!-- ================================
         STRENGHEID
    ================================= -->

    <div class="slider-container">


      <label for="strengheid">
        Hoe streng is je docent?
      </label>


      <input

        class="slider"

        type="range"

        id="strengheid"

        min="1"

        max="10"

        value="5"

        step="1"

        oninput="
          document.getElementById('strengheidWaarde').textContent = this.value;
        "

      >


      <div class="strength-display">

        Strengheid:

        <span class="strength-number">

          <span id="strengheidWaarde">
            5
          </span>

          /10

        </span>

      </div>


    </div>


    <!-- ================================
         GENERATE KNOP
    ================================= -->

    <button

      class="generate-button"

      id="generateButton"

      type="button"

    >

      ✨ Genereer mijn smoes

    </button>


    <!-- ================================
         RESULTAAT
    ================================= -->

    <div

      class="result"

      id="result"

    >

      <div class="result-title">

        💡 Jouw smoes

      </div>


      <div

        class="result-text"

        id="resultText"

      ></div>

      <button id="shareBtn" style="width: 100%; background: linear-gradient(135deg, #6c63ff, #4840e6); color: #ffffff; border: none; padding: 14px 20px; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; box-shadow: 0 4px 15px rgba(108, 99, 255, 0.3);">
  Deel dit!
</button>

    </div>


  </div>


  <!-- ================================
       JAVASCRIPT
  ================================= -->

  <script src="script.js"></script>
<footer class="footer-text">
  <p>Made by Hessel Hagedoorn. <br>
  Heb je zelf een meesterlijke smoes? Stuur 'm in via <a href="mailto:excuusexpert@outlook.com" style="color: inherit; text-decoration: underline;">excuusexpert@outlook.com</a> <br> beta V3.0
  </p>
</footer>
  
</body>

</html>
