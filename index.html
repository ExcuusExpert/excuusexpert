<html lang="nl">
<head>
  <meta charset="UTF-8">

  <!-- Modern Lettertype & FontAwesome Iconen -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script data-goatcounter="https://excuusexpert.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>

  <style>
    /* Inzend-link styling in footer */
.footer-submit-btn {
  color: #818cf8;
  background: none;
  border: none;
  font-family: inherit;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
  text-decoration: underline;
  padding: 0;
}

.footer-submit-btn:hover {
  color: #ffffff;
}

/* Inzend Modal Styling */
.submit-card {
  border-color: rgba(108, 99, 255, 0.4) !important;
  box-shadow: 0 0 40px rgba(108, 99, 255, 0.25) !important;
}

.submit-textarea {
  width: 100%;
  min-height: 90px;
  background: var(--input-bg);
  color: var(--text-main);
  border: 1px solid var(--border-color);
  border-radius: 12px;
  padding: 12px;
  font-family: inherit;
  font-size: 14px;
  resize: vertical;
  margin-bottom: 16px;
  outline: none;
  box-sizing: border-box;
}

.submit-textarea:focus {
  border-color: var(--border-hover);
}
    /* ================================
       THEMA & ANIMAITES
    ================================= */
    :root {
      --bg-dark: #08090e;
      --card-bg: rgba(18, 20, 33, 0.75);
      --input-bg: rgba(10, 12, 20, 0.8);
      --border-color: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(108, 99, 255, 0.4);
      --primary: #6c63ff;
      --primary-gradient: linear-gradient(135deg, #6c63ff 0%, #4f46e5 100%);
      --primary-glow: rgba(108, 99, 255, 0.4);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
      overflow-x: hidden;
      position: relative;
    }

    /* Vloeiend ademende achtergrond bol */
    body::before {
      content: '';
      position: absolute;
      width: 350px;
      height: 350px;
      background: radial-gradient(circle, rgba(108, 99, 255, 0.25) 0%, rgba(0,0,0,0) 70%);
      top: 10%;
      left: 50%;
      transform: translateX(-50%);
      z-index: -1;
      animation: pulseGlow 8s ease-in-out infinite alternate;
    }

    @keyframes pulseGlow {
      0% { transform: translateX(-50%) scale(0.8); opacity: 0.5; }
      100% { transform: translateX(-50%) scale(1.3); opacity: 0.9; }
    }

    /* ================================
       CONTAINER (GLASSMORPHISM V2)
    ================================= */
    .container {
      width: 100%;
      max-width: 500px;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 40px 32px;
      border-radius: 28px;
      border: 1px solid var(--border-color);
      box-shadow: 0 30px 60px rgba(0, 0, 0, 0.6),
                  0 0 40px rgba(108, 99, 255, 0.15);
      transition: border-color 0.3s ease;
    }

    /* ================================
       LOGO & TYPOGRAFIE
    ================================= */
    .logo {
      text-align: center;
      font-size: 38px;
      font-weight: 800;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #ffffff 40%, #818cf8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -1px;
    }

    .description {
      text-align: center;
      color: var(--text-muted);
      font-size: 15px;
      margin-bottom: 24px;
    }

    /* ================================
       PANIEKKNOP STYLING
    ================================= */
    .panic-container {
      width: 100%;
      margin: 0 auto 28px auto;
      text-align: center;
    }

    #panicBtn {
      width: 100%;
      padding: 14px 18px;
      background: linear-gradient(135deg, #b91c1c 0%, #7f1d1d 100%);
      color: #ffffff;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      border: 1px solid rgba(239, 68, 68, 0.3);
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(127, 29, 29, 0.35);
      transition: all 0.2s ease;
      letter-spacing: 0.5px;
    }

    #panicBtn:hover {
      background: linear-gradient(135deg, #dc2626 0%, #991b1b 100%);
      box-shadow: 0 6px 20px rgba(220, 38, 38, 0.4);
    }

    #panicBtn:active {
      transform: scale(0.98);
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 10px;
      color: #e2e8f0;
      letter-spacing: 0.2px;
    }

    /* ================================
       CUSTOM SELECT FIELD
    ================================= */
    .select-wrapper {
      position: relative;
    }

    .select-wrapper::after {
      content: '\f107';
      font-family: 'Font Awesome 6 Free';
      font-weight: 900;
      position: absolute;
      right: 18px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
      transition: color 0.2s ease;
    }

    select {
      width: 100%;
      padding: 16px 18px;
      background: var(--input-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
      transition: all 0.25s ease;
    }

    select:hover, select:focus {
      border-color: var(--border-hover);
      box-shadow: 0 0 15px rgba(108, 99, 255, 0.15);
    }

    /* ================================
       SLIDER DESIGN
    ================================= */
    .slider-container {
      margin-top: 28px;
    }

    .slider {
      width: 100%;
      height: 8px;
      border-radius: 10px;
      background: linear-gradient(to right, #3b82f6, #ef4444);
      outline: none;
      cursor: pointer;
      appearance: none;
      -webkit-appearance: none;
    }

    .slider::-webkit-slider-thumb {
      appearance: none;
      -webkit-appearance: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 0 15px rgba(0, 0, 0, 0.5);
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .slider::-webkit-slider-thumb:hover {
      transform: scale(1.15);
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
    }

    .strength-display {
      text-align: center;
      margin-top: 14px;
      color: var(--text-muted);
      font-size: 14px;
    }

    .strength-number {
      color: #818cf8;
      font-size: 20px;
      font-weight: 700;
      margin-left: 4px;
    }

    /* ================================
       HOOFDKNOP
    ================================= */
    .generate-button {
      width: 100%;
      margin-top: 32px;
      padding: 18px;
      border: none;
      border-radius: 14px;
      background: var(--primary-gradient);
      color: white;
      font-size: 16px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      box-shadow: 0 10px 25px var(--primary-glow);
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
    }

    .generate-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 30px rgba(108, 99, 255, 0.5);
    }

    .generate-button:active {
      transform: translateY(1px);
    }

    .generate-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* ================================
       RESULTAAT CARD
    ================================= */
    .result {
      display: none;
      margin-top: 28px;
      padding: 24px;
      background: var(--input-bg);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      animation: popup 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes popup {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .result-title {
      color: #818cf8;
      font-weight: 700;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .result-text {
      color: #f1f5f9;
      line-height: 1.65;
      font-size: 16px;
      font-weight: 500;
    }

    /* ================================
       ACTIEKNOPPEN (GRID)
    ================================= */
    .button-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 20px;
    }

    .action-btn {
      padding: 14px 16px;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s ease;
    }

    #copyBtn {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-main);
      border: 1px solid var(--border-color);
    }

    #copyBtn:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
    }

    #shareBtn {
      background: var(--primary-gradient);
      color: #ffffff;
      box-shadow: 0 4px 15px var(--primary-glow);
    }

    #shareBtn:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(108, 99, 255, 0.5);
    }

    /* ================================
       FOOTER
    ================================= */
    .footer-text {
      text-align: center;
      color: var(--text-muted);
      font-size: 13px;
      margin-top: 28px;
      line-height: 1.6;
    }

    .footer-text a {
      color: #818cf8;
      text-decoration: none;
      transition: color 0.2s ease;
    }

    .footer-text a:hover {
      color: #ffffff;
      text-decoration: underline;
    }

    /* ================================
       MODAL POP-UP STYLING
    ================================= */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(4, 5, 8, 0.85);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      padding: 20px;
      box-sizing: border-box;
    }

    .modal-card {
      background: rgba(18, 20, 33, 0.95);
      border: 1px solid rgba(239, 68, 68, 0.4);
      box-shadow: 0 0 40px rgba(239, 68, 68, 0.25);
      border-radius: 24px;
      padding: 24px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      margin: auto;
      box-sizing: border-box;
      animation: popUp 0.25s ease-out;
    }

    @keyframes popUp {
      from { transform: scale(0.8); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .modal-badge {
      background: rgba(239, 68, 68, 0.2);
      color: #fca5a5;
      font-size: 11px;
      font-weight: 800;
      padding: 4px 12px;
      border-radius: 20px;
    }

    .close-btn {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 24px;
      cursor: pointer;
    }

    .modal-text {
      font-size: 16px;
      color: #ffffff;
      line-height: 1.5;
      margin-bottom: 20px;
      font-weight: 600;
    }

    .copy-panic-btn {
      width: 100%;
      padding: 12px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 12px;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }

    @media (max-width: 500px) {
      .container { padding: 28px 20px; }
      .logo { font-size: 32px; }
      .button-group { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1 class="logo">ExcuusExpert</h1>
    <p class="description">De slimste smoesgenerator voor school.</p>

    <!-- INSTANT PANIEKKNOP -->
    <div class="panic-container">
      <button id="panicBtn" onclick="generatePanicExcuse()">
        <i class="fa-solid fa-triangle-exclamation"></i> INSTANT PANIEKKNOP
      </button>
    </div>

    <label for="probleem">Wat is er gebeurd?</label>
    <div class="select-wrapper">
      <select id="probleem">
        <option value="Te laat">Te laat</option>
        <option value="Huiswerk vergeten">Huiswerk vergeten</option>
        <option value="Proefwerk niet geleerd">Proefwerk niet geleerd</option>
        <option value="Boek vergeten">Boek vergeten</option>
        <option value="Te weinig tijd gehad">Te weinig tijd gehad</option>
      </select>
    </div>

    <div class="slider-container">
      <label for="strengheid">Hoe streng is je docent?</label>
      <input
        class="slider"
        type="range"
        id="strengheid"
        min="1"
        max="10"
        value="5"
        step="1"
        oninput="document.getElementById('strengheidWaarde').textContent = this.value;"
      >
      <div class="strength-display">
        Strengheid: <span class="strength-number"><span id="strengheidWaarde">5</span>/10</span>
      </div>
    </div>

    <button class="generate-button" id="generateButton" type="button">
      ✨ Genereer mijn smoes
    </button>

    <div class="result" id="result">
      <div class="result-title">
        <i class="fa-solid fa-lightbulb"></i> Jouw smoes
      </div>
      <div class="result-text" id="resultText"></div>

      <div class="button-group">
        <button id="copyBtn" class="action-btn">
          <i class="fa-regular fa-copy"></i> Kopieer
        </button>
        <button id="shareBtn" class="action-btn">
          <i class="fa-solid fa-share-nodes"></i> Deel dit!
        </button>
      </div>
    </div>

  </div>

  <!-- POP-UP MODAL (STAAT BUITEN DE CONTAINER VOOR PERFECTE CENTRERING) -->
  <div id="panicModal" class="modal-overlay" onclick="closePanicModal(event)">
    <div class="modal-card">
      <div class="modal-header">
        <span class="modal-badge">🚨 SPOEDEXCUUS</span>
        <button class="close-btn" onclick="closePanicModalDirect()">&times;</button>
      </div>
      <p id="panicText" class="modal-text"></p>
      <button class="copy-panic-btn" onclick="copyPanicExcuse()">
        <i class="fa-regular fa-copy"></i> Kopieer Excuus
      </button>
    </div>
  </div>

  <script src="script.js"></script>
<!-- INSTUUR MODAL POP-UP -->
  <div id="submitModal" class="modal-overlay" onclick="closeSubmitModal(event)">
    <div class="modal-card submit-card">
      <div class="modal-header">
        <span class="modal-badge" style="background: rgba(108, 99, 255, 0.2); color: #a5b4fc;">💡 SMOES INSTUREN</span>
        <button class="close-btn" onclick="closeSubmitModalDirect()">&times;</button>
      </div>
      
      <form id="excuseForm" action="https://formspree.io/f/xkjngdbl" method="POST" onsubmit="handleFormSubmit(event)">
        <textarea name="smoes" class="submit-textarea" placeholder="Typ hier jouw meesterlijke smoes..." required></textarea>
        <button type="submit" class="generate-button" style="margin-top: 0; padding: 12px;">
          🚀 Versturen
        </button>
      </form>
    </div>
  </div>

  <script src="script.js"></script>

  <!-- VERNIEUWDE FOOTER -->
  <footer class="footer-text">
    <p>Made by less.<br>
    Heb je zelf een meesterlijke smoes? 
    <button class="footer-submit-btn" onclick="openSubmitModal()">Stuur 'm direct in!</button></p>
    
    <a href="https://snapchat.com/add/Excuus-Expert" target="_blank" rel="noopener noreferrer" class="footer-snapchat-btn">
      <i class="fa-brands fa-snapchat"></i> Volg mij op Snapchat
    </a>

    <p>beta V5.0</p>
  </footer>

</body>
</html>
